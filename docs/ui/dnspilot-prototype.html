<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNSPilot UI Prototype</title>
<style>
/* ===== Tokens: macOS 26 Liquid Glass approximations ===== */
:root {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --wallpaper:
    radial-gradient(1200px 700px at 12% 18%, #8fc3e8 0%, transparent 60%),
    radial-gradient(900px 700px at 85% 25%, #f2c99a 0%, transparent 55%),
    radial-gradient(1000px 800px at 60% 95%, #5f9fb8 0%, transparent 60%),
    linear-gradient(160deg, #cfe3ee 0%, #a9cbd9 100%);
  --window: #ffffff;               /* Tahoe window/content background */
  --content: #ffffff;
  --group: rgba(0,0,0,.036);       /* grouped Form section fill */
  --group-strong: rgba(0,0,0,.055);
  --fill: rgba(0,0,0,.06);         /* bordered button / track fill */
  --fill-press: rgba(0,0,0,.11);
  --field: #ffffff;
  --field-border: rgba(0,0,0,.13);
  --label: rgba(0,0,0,.86);
  --secondary: rgba(0,0,0,.5);
  --tertiary: rgba(0,0,0,.26);
  --separator: rgba(0,0,0,.08);
  --hover: rgba(0,0,0,.045);
  --selection: rgba(0,0,0,.075);
  --accent: #0088ff;
  --accent-text: #ffffff;
  --accent-soft: rgba(0,136,255,.13);
  --green: #1aa53a; --red: #e5322a; --orange: #e0820a;
  --green-soft: rgba(52,199,89,.15); --red-soft: rgba(255,56,60,.12); --orange-soft: rgba(255,141,40,.16); --gray-soft: rgba(0,0,0,.055);
  /* glass */
  --glass: rgba(255,255,255,.58);
  --glass-strong: rgba(250,250,252,.78);
  --glass-tint-sidebar: rgba(244,245,247,.62);
  --glass-hi: rgba(255,255,255,.95);
  --glass-edge: rgba(0,0,0,.07);
  --glass-shadow: 0 6px 22px rgba(0,0,0,.09), 0 1px 3px rgba(0,0,0,.06);
  --glass-blur: blur(18px) saturate(1.9);
  --switch-off: rgba(0,0,0,.1);
  --shadow-window: 0 0 0 .5px rgba(0,0,0,.16), 0 30px 80px rgba(0,0,0,.24), 0 6px 18px rgba(0,0,0,.1);
  --shadow-menu: 0 0 0 .5px rgba(0,0,0,.1), 0 14px 40px rgba(0,0,0,.18);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --wallpaper:
    radial-gradient(1200px 700px at 12% 18%, #1d4a6b 0%, transparent 60%),
    radial-gradient(900px 700px at 85% 25%, #5a3d22 0%, transparent 55%),
    radial-gradient(1000px 800px at 60% 95%, #123c4a 0%, transparent 60%),
    linear-gradient(160deg, #0f1a22 0%, #0b1217 100%);
  --window: #1e1e20;
  --content: #1e1e20;
  --group: rgba(255,255,255,.05);
  --group-strong: rgba(255,255,255,.08);
  --fill: rgba(255,255,255,.1);
  --fill-press: rgba(255,255,255,.16);
  --field: rgba(0,0,0,.25);
  --field-border: rgba(255,255,255,.13);
  --label: rgba(255,255,255,.9);
  --secondary: rgba(255,255,255,.55);
  --tertiary: rgba(255,255,255,.25);
  --separator: rgba(255,255,255,.08);
  --hover: rgba(255,255,255,.06);
  --selection: rgba(255,255,255,.1);
  --accent: #0a8cff;
  --accent-soft: rgba(10,140,255,.24);
  --green: #30d158; --red: #ff4245; --orange: #ff9f0a;
  --green-soft: rgba(48,209,88,.17); --red-soft: rgba(255,66,69,.17); --orange-soft: rgba(255,159,10,.18); --gray-soft: rgba(255,255,255,.08);
  --glass: rgba(58,58,62,.5);
  --glass-strong: rgba(44,44,48,.8);
  --glass-tint-sidebar: rgba(46,46,50,.62);
  --glass-hi: rgba(255,255,255,.2);
  --glass-edge: rgba(255,255,255,.08);
  --glass-shadow: 0 6px 22px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --switch-off: rgba(255,255,255,.16);
  --shadow-window: 0 0 0 .5px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07) inset, 0 30px 80px rgba(0,0,0,.6);
  --shadow-menu: 0 0 0 .5px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.38 var(--font); color: var(--label); background: var(--wallpaper); -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
button, input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.secondary { color: var(--secondary); } .tertiary { color: var(--tertiary); } .caption { font-size: 11px; }
.green { color: var(--green); } .red { color: var(--red); } .orange { color: var(--orange); } .accent { color: var(--accent); }
.selectable { user-select: text; cursor: text; }

/* ===== Liquid Glass material =====
   Translucent fill + backdrop blur, a bright specular top edge,
   a hairline outline, and a soft lift shadow. Never nest glass in glass. */
.glass {
  background: var(--glass);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), var(--glass-shadow);
}
.glass-strong { background: var(--glass-strong); }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--glass-strong); backdrop-filter: none; } }

/* ===== Desktop ===== */
.menubar { position: fixed; inset: 0 0 auto 0; height: 28px; z-index: 50; display: flex; align-items: center; gap: 2px; padding: 0 10px; font-size: 13px; background: transparent; color: var(--label); }
.menubar .mb-item { padding: 2px 10px; border-radius: 8px; }
.menubar .mb-item.app { font-weight: 700; }
.menubar .spacer { flex: 1; }
.menubar .extra { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 8px; cursor: default; }
.menubar .extra.open, .menubar .extra:hover { background: rgba(255,255,255,.35); }
:root[data-theme="dark"] .menubar .extra.open, :root[data-theme="dark"] .menubar .extra:hover { background: rgba(255,255,255,.14); }
.desktop { position: fixed; inset: 28px 0 0 0; overflow: auto; }
.stage { position: relative; min-width: 1320px; min-height: 820px; height: 100%; }

/* ===== Prototype control panel (not part of the app) ===== */
.proto { position: absolute; right: 18px; top: 16px; width: 272px; z-index: 5; border-radius: 22px; padding: 14px 16px 16px; font-size: 12px; }
.proto h3 { margin: 0 0 2px; font-size: 13px; }
.proto .sub { color: var(--secondary); margin-bottom: 10px; }
.proto label { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
.proto select { width: 100%; height: 24px; padding: 0 8px; border-radius: 12px; border: 0; background: var(--fill); }
.proto .proto-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.proto .notes { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--separator); }
.proto .notes b { display: block; margin-bottom: 4px; }
.proto .notes ul { margin: 0; padding-left: 16px; color: var(--secondary); }
.proto .notes li { margin: 3px 0; }

/* ===== Window chrome ===== */
.window { position: absolute; background: var(--window); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-window); display: flex; }
.window.inactive .traffic span { background: var(--tertiary) !important; box-shadow: none; }
.traffic { display: flex; gap: 9px; }
.traffic span { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.traffic span:nth-child(1) { background: #ff5f57; } .traffic span:nth-child(2) { background: #febc2e; } .traffic span:nth-child(3) { background: #28c840; }

/* Main window: floating glass sidebar over a full-bleed content layer */
#main { left: 56px; top: 44px; }
.sidebar {
  width: 222px; flex: none; margin: 8px 0 8px 8px; border-radius: 18px;
  background: var(--glass-tint-sidebar);
  display: flex; flex-direction: column; padding: 10px 8px 8px; position: relative; z-index: 4;
}
.sidebar[hidden] { display: none; }
.sb-top { display: flex; align-items: center; height: 34px; padding: 0 2px 0 8px; margin-bottom: 10px; }
.sb-top .spacer { flex: 1; }
.sb-item { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border-radius: 10px; cursor: default; }
.sb-item svg { color: var(--accent); width: 17px; height: 17px; }
.sb-item:hover { background: var(--hover); }
.sb-item.sel { background: var(--selection); font-weight: 600; }
.sb-item .key { margin-left: auto; color: var(--tertiary); font-size: 11px; font-weight: 400; }
.sb-status { margin-top: auto; padding: 10px 12px; border-radius: 14px; background: var(--group-strong); display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; cursor: default; }
.sb-status:hover { background: var(--selection); }
.sb-status .t { font-weight: 600; font-size: 12px; }
.sb-status .s { grid-column: 2; font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--content); }
/* Toolbar floats over content; a scroll-edge blur keeps it legible */
.toolbar { position: absolute; inset: 0 0 auto 0; height: 60px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 22px; }
.toolbar::before { content: ""; position: absolute; inset: 0 0 -14px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--content) 30%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  mask-image: linear-gradient(#000 55%, transparent); -webkit-mask-image: linear-gradient(#000 55%, transparent); }
.toolbar .title { font-size: 15px; font-weight: 600; }
.toolbar .subtitle { font-size: 11px; color: var(--secondary); margin-left: 2px; }
.toolbar .spacer { flex: 1; }
.tb-group { display: flex; align-items: center; height: 36px; padding: 0 3px; border-radius: 18px; }
.tb-btn { width: 36px; height: 30px; border-radius: 15px; border: 0; background: none; display: grid; place-items: center; color: var(--label); cursor: default; }
.tb-group > .tb-btn + .tb-btn { width: 32px; }
.tb-btn svg { width: 17px; height: 17px; }
.tb-btn:hover { background: var(--hover); }
.tb-btn:disabled { color: var(--tertiary); }
.tb-circle { width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--label); cursor: default; padding: 0; }
.tb-circle svg { width: 17px; height: 17px; }
.page { flex: 1; min-height: 0; overflow: auto; padding-top: 60px; }
.page-inner { max-width: 700px; margin: 0 auto; padding: 4px 26px 32px; }

/* ===== Grouped form (Tahoe: plain background, softly filled sections) ===== */
.section { margin: 0 0 20px; }
.section-header { font-size: 13px; font-weight: 600; color: var(--label); padding: 0 12px 7px; display: flex; align-items: baseline; gap: 8px; }
.section-header .hint { font-weight: 400; font-size: 12px; color: var(--secondary); }
.group { background: var(--group); border-radius: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 42px; padding: 7px 14px; position: relative; }
.row + .row::before, .row + .field-error + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px; background: var(--separator); }
.row > .val { margin-left: auto; text-align: right; color: var(--secondary); min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.row.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.row.clickable { cursor: default; }
.row.clickable:hover { background: var(--hover); }
.group > .row:first-child { border-radius: 16px 16px 0 0; } .group > .row:last-child { border-radius: 0 0 16px 16px; } .group > .row:only-child { border-radius: 16px; }
.section-footer { font-size: 11px; color: var(--secondary); padding: 7px 12px 0; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-list { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }

/* ===== Controls ===== */
.btn { height: 28px; padding: 0 14px; border-radius: 14px; border: 0; cursor: default; background: var(--fill); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--label); }
.btn:hover { background: var(--fill-press); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: inset 0 1px 0 rgba(255,255,255,.28); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.destructive { color: var(--red); }
.btn.large { height: 34px; padding: 0 20px; border-radius: 17px; }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn:disabled { opacity: .4; transform: none; }
.link { border: 0; background: none; color: var(--accent); padding: 0; cursor: default; display: inline-flex; align-items: center; gap: 3px; }
.link svg { width: 12px; height: 12px; }
.link:hover { text-decoration: underline; }
.link:disabled { color: var(--tertiary); text-decoration: none; }

/* Tahoe switch: wide track, pill-shaped knob */
.switch { position: relative; width: 42px; height: 24px; border-radius: 12px; border: 0; padding: 0; background: var(--switch-off); flex: none; cursor: default; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 20px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.05); transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(12px); }
.switch.large { width: 52px; height: 30px; border-radius: 15px; }
.switch.large::after { width: 32px; height: 26px; border-radius: 13px; }
.switch.large.on::after { transform: translateX(16px); }
.switch:disabled { opacity: .4; }

/* Tahoe segmented: capsule track, accent-filled selection */
.seg { display: inline-flex; padding: 2px; border-radius: 15px; background: var(--fill); }
.seg button { border: 0; background: none; height: 26px; padding: 0 14px; border-radius: 13px; cursor: default; white-space: nowrap; color: var(--label); transition: background .15s; }
.seg button:hover:not(.on) { background: var(--hover); }
.seg button.on { background: var(--accent); color: #fff; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.seg.full { display: flex; } .seg.full button { flex: 1; }
.seg:has(button:disabled) { opacity: .45; }

.popup { height: 28px; padding: 0 10px 0 13px; border-radius: 14px; border: 0; background: var(--fill); display: inline-flex; align-items: center; gap: 6px; cursor: default; max-width: 260px; color: var(--label); }
.popup:hover { background: var(--fill-press); }
.popup .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup svg { width: 11px; height: 11px; color: var(--secondary); }
.popup:disabled { opacity: .4; }

.field { height: 28px; border-radius: 9px; border: 0; background: var(--field); box-shadow: inset 0 0 0 1px var(--field-border); padding: 0 10px; outline: none; min-width: 0; user-select: text; }
.field:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3.5px var(--accent-soft); }
.field.invalid { box-shadow: inset 0 0 0 1px var(--red), 0 0 0 3.5px var(--red-soft); }
.field:disabled { opacity: .5; }
.field.grow { flex: 1; } .field.right { text-align: right; }
.field-error { display: flex; gap: 5px; align-items: center; color: var(--red); font-size: 11px; padding: 0 14px 9px; margin-top: -3px; justify-content: flex-end; }
.field-error svg { width: 13px; height: 13px; }

.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tertiary); border-top-color: var(--secondary); animation: spin .8s linear infinite; flex: none; }
.spinner.large { width: 26px; height: 26px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } * { transition: none !important; } }
.status-inline { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.status-inline svg { width: 14px; height: 14px; }
.tag { font-size: 11px; color: var(--secondary); display: inline-flex; align-items: center; gap: 3px; }
.tag svg { width: 12px; height: 12px; }

/* ===== Overview ===== */
.hero { display: flex; align-items: center; gap: 16px; padding: 18px 18px 18px 16px; }
.hero .badge { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.hero .badge svg { width: 26px; height: 26px; stroke-width: 1.7; }
.hero .badge.on { background: var(--green-soft); color: var(--green); }
.hero .badge.off { background: var(--gray-soft); color: var(--secondary); }
.hero .badge.warn { background: var(--orange-soft); color: var(--orange); }
.hero .badge.err { background: var(--red-soft); color: var(--red); }
.hero .badge.busy { background: var(--accent-soft); color: var(--accent); }
.hero h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
.hero p { margin: 2px 0 0; color: var(--secondary); }
.hero .grow { flex: 1; min-width: 0; }
.notice { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; padding: 14px 16px; }
.notice > span:first-child svg { width: 20px; height: 20px; margin-top: 1px; }
.notice .t { font-weight: 600; }
.notice .m { grid-column: 2; color: var(--secondary); }
.notice .a { grid-column: 2; display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.footer-actions { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
.footer-actions .spacer { flex: 1; }

/* ===== Split panes ===== */
.split { flex: 1; min-height: 0; display: flex; margin-top: 60px; }
.pane { min-width: 0; display: flex; flex-direction: column; position: relative; }
.pane.list { flex: 0 1 34%; min-width: 0; max-width: 320px; }
.pane.fill { flex: 1; }
.divider { width: 9px; margin: 0 -4px; cursor: col-resize; z-index: 2; flex: none; position: relative; }
.divider::after { content: ""; position: absolute; top: 0; bottom: 12px; left: 4px; width: 1px; background: var(--separator); }
.list-scroll { flex: 1; overflow: auto; padding: 2px 10px 60px; }
.list-filter { padding: 0 12px 10px; }
.list-filter .field { width: 100%; padding-left: 30px; border-radius: 14px; background: var(--fill); box-shadow: none; }
.list-filter .field:focus { box-shadow: 0 0 0 3.5px var(--accent-soft), inset 0 0 0 1px var(--accent); }
.list-filter .wrap { position: relative; }
.list-filter svg { position: absolute; left: 10px; top: 6px; color: var(--secondary); width: 15px; height: 15px; }
.lrow { display: grid; grid-template-columns: 24px 1fr auto; gap: 1px 9px; padding: 8px 10px; border-radius: 12px; align-items: center; cursor: default; }
.lrow:hover { background: var(--hover); }
.lrow.sel { background: var(--accent); color: var(--accent-text); }
.lrow.sel .secondary, .lrow.sel .tag, .lrow.sel .proto-ic { color: rgba(255,255,255,.85); }
.lrow.sel .tag svg { color: #fff; }
.lrow .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .sum { grid-column: 2; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .proto-ic { color: var(--secondary); grid-row: span 2; }
.lrow .trail { grid-row: span 2; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
/* Floating glass control cluster at the bottom of a list */
.bottombar { position: absolute; left: 12px; bottom: 12px; height: 36px; display: flex; align-items: center; gap: 0; padding: 0 3px; border-radius: 18px; z-index: 2; }
.bb-btn { width: 32px; height: 30px; border-radius: 15px; border: 0; background: none; display: grid; place-items: center; cursor: default; color: var(--label); }
.bb-btn:hover { background: var(--hover); }
.bb-btn:disabled { color: var(--tertiary); background: none; }
.bb-sep { width: 1px; height: 16px; background: var(--separator); margin: 0 3px; }
.bottombar .info, .group-bottombar .info { margin-left: auto; font-size: 11px; color: var(--secondary); padding-right: 8px; }

.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 6px 24px 18px; }
.detail-head .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--group-strong); display: grid; place-items: center; color: var(--secondary); flex: none; }
.detail-head .ic svg { width: 21px; height: 21px; }
.detail-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.detail-head p { margin: 1px 0 0; color: var(--secondary); font-size: 12px; }
.detail-head .grow { flex: 1 1 140px; min-width: 120px; }
.detail-head .actions { display: flex; margin-left: auto; gap: 8px; align-items: center; }
.detail-body { padding: 0 24px 28px; overflow: auto; flex: 1; }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 24px; color: var(--secondary); }
.empty svg { width: 42px; height: 42px; stroke-width: 1.3; color: var(--tertiary); margin-bottom: 6px; }
.empty .t { font-size: 17px; font-weight: 700; color: var(--label); }
.empty .btn { margin-top: 8px; }

/* Rules */
.rule-row { display: grid; grid-template-columns: 14px 18px 42px 1fr auto; align-items: center; gap: 10px; padding: 9px 14px; position: relative; cursor: default; }
.rule-row + .rule-row::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px; background: var(--separator); }
.rule-row:hover { background: var(--hover); }
.rule-row.sel { background: var(--accent-soft); }
.rule-row.dragging { opacity: .4; }
.rule-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.rule-row .grip { color: var(--tertiary); cursor: grab; }
.rule-row .grip svg { width: 14px; height: 14px; }
.rule-row .num { color: var(--secondary); font-variant-numeric: tabular-nums; text-align: right; }
.rule-row .nm { font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; }
.rule-row .cond { font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rule-row .target { display: flex; align-items: center; gap: 6px; color: var(--secondary); white-space: nowrap; }
.rule-row .target svg { width: 12px; height: 12px; }
.rule-row.disabled .nm, .rule-row.disabled .target { opacity: .5; }
.match { font-size: 11px; color: var(--green); display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }
.match svg { width: 12px; height: 12px; }
.group > .rule-row:first-child { border-radius: 16px 16px 0 0; }
.group-bottombar { display: flex; align-items: center; gap: 0; padding: 6px 8px; border-top: 1px solid var(--separator); }

/* Test */
.result-head { display: flex; align-items: center; gap: 10px; padding: 6px 24px 14px; }
.result-head .code { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.answers { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
.answers th { text-align: left; font: 600 11px var(--font); color: var(--secondary); padding: 9px 14px 7px; border-bottom: 1px solid var(--separator); }
.answers td { padding: 7px 14px; border-top: 1px solid var(--separator); user-select: text; }
.answers tr:first-child td { border-top: 0; }

.list-editor { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.list-editor .item { display: flex; gap: 6px; align-items: center; }
.minus { width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: var(--red); display: grid; place-items: center; cursor: default; flex: none; }
.minus:hover { background: var(--red-soft); }
.minus svg { width: 16px; height: 16px; }
.hosts-table { width: 100%; border-collapse: collapse; }
.hosts-table th { text-align: left; font-size: 11px; color: var(--secondary); font-weight: 600; padding: 2px 4px 6px; }
.hosts-table td { padding: 3px 4px; }
.hosts-table .field { width: 100%; }

/* ===== Sheet / Alert ===== */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.1); display: flex; justify-content: center; align-items: flex-start; }
:root[data-theme="dark"] .scrim { background: rgba(0,0,0,.3); }
.sheet { margin-top: 18px; width: 580px; max-height: calc(100% - 36px); background: var(--window); border-radius: 26px; box-shadow: 0 0 0 .5px var(--glass-edge), 0 24px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; overflow: hidden; animation: sheetIn .26s cubic-bezier(.2,1.2,.4,1); }
@keyframes sheetIn { from { transform: translateY(-16px) scale(.98); opacity: 0; } }
.sheet-title { padding: 20px 24px 8px; font-size: 16px; font-weight: 700; }
.sheet-body { overflow: auto; padding: 8px 20px 4px; flex: 1; }
.sheet-foot { display: flex; align-items: center; gap: 8px; padding: 14px 18px 18px; }
.sheet-foot .spacer { flex: 1; }
.alert-scrim { align-items: center; }
.alert { width: 280px; border-radius: 28px; padding: 22px 18px 18px; text-align: center; animation: pop .2s cubic-bezier(.2,1.3,.4,1); background: var(--glass-strong); }
@keyframes pop { from { transform: scale(1.08); opacity: 0; } }
.alert .app-ic { width: 56px; height: 56px; margin: 0 auto 12px; }
.alert .t { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.alert .m { font-size: 12px; color: var(--secondary); margin-bottom: 16px; }
.alert .extra { text-align: left; margin-bottom: 12px; }
.alert .btns { display: flex; flex-direction: column; gap: 8px; }
.alert .btns .btn { height: 32px; border-radius: 16px; justify-content: center; }
.alert .btns.row2 { flex-direction: row; } .alert .btns.row2 .btn { flex: 1; }

/* ===== Menus ===== */
.menu-layer { position: fixed; inset: 0; z-index: 100; }
.menu { position: fixed; min-width: 210px; padding: 6px; border-radius: 16px; font-size: 13px; }
.mi { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 9px; cursor: default; white-space: nowrap; }
.mi .ck svg { width: 13px; height: 13px; stroke-width: 2.2; }
.mi .kb { color: var(--secondary); font-size: 12px; padding-left: 18px; }
.mi:hover:not(.dis) { background: var(--accent); color: #fff; }
.mi:hover:not(.dis) .kb, .mi:hover:not(.dis) .sub-ar { color: rgba(255,255,255,.85); }
.mi.dis { color: var(--tertiary); }
.mi.info { color: var(--secondary); }
.mi.info.strong { color: var(--label); font-weight: 600; }
.mi.danger { color: var(--red); }
.mi .sub-ar svg { width: 10px; height: 10px; }
.msep { height: 1px; background: var(--separator); margin: 5px 10px; }
.mhead { font-size: 11px; font-weight: 600; color: var(--secondary); padding: 4px 10px 2px 30px; }

/* ===== Settings window ===== */
#settings { width: 580px; height: 580px; flex-direction: column; }
.settings-bar { flex: none; padding: 14px 16px 6px; display: flex; flex-direction: column; align-items: center; position: relative; }
.settings-bar .traffic { position: absolute; left: 18px; top: 18px; }
.settings-bar .ttl { font-weight: 600; font-size: 13px; margin-bottom: 10px; }
.settings-tabs { display: flex; gap: 2px; padding: 4px; border-radius: 22px; }
.settings-tab { width: 78px; padding: 5px 0 4px; border-radius: 16px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--secondary); cursor: default; }
.settings-tab svg { width: 21px; height: 21px; stroke-width: 1.45; }
.settings-tab:hover { background: var(--hover); }
.settings-tab.on { background: var(--selection); color: var(--accent); }
.settings-body { flex: 1; overflow: auto; padding: 14px 22px 22px; }

/* ===== Onboarding window ===== */
#onboarding { width: 700px; height: 520px; }
.ob-steps { width: 196px; flex: none; margin: 8px 0 8px 8px; border-radius: 18px; background: var(--glass-tint-sidebar); padding: 18px 8px; display: flex; flex-direction: column; gap: 2px; }
.ob-steps .traffic { margin: 0 0 24px 10px; }
.ob-step { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border-radius: 10px; color: var(--secondary); }
.ob-step .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600; box-shadow: inset 0 0 0 1.2px var(--tertiary); flex: none; }
.ob-step.done .dot { background: var(--green); box-shadow: none; color: #fff; }
.ob-step.done .dot svg { width: 11px; height: 11px; stroke-width: 2.4; }
.ob-step.cur { background: var(--selection); color: var(--label); font-weight: 600; }
.ob-step.cur .dot { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
.ob-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.ob-content { flex: 1; overflow: auto; padding: 40px 34px 16px; }
.ob-content h2 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.ob-content > p { margin: 0 0 20px; color: var(--secondary); max-width: 430px; }
.ob-foot { display: flex; gap: 8px; padding: 14px 18px 18px; align-items: center; }
.ob-foot .spacer { flex: 1; }
.choice { display: grid; grid-template-columns: 18px 1fr; gap: 0 12px; align-items: center; padding: 10px 14px; position: relative; cursor: default; }
.choice:hover { background: var(--hover); }
.group > .choice:first-child { border-radius: 16px 16px 0 0; } .group > .choice:last-child { border-radius: 0 0 16px 16px; }
.choice + .choice::before { content: ""; position: absolute; top: 0; left: 44px; right: 14px; height: 1px; background: var(--separator); }
.choice .radio { width: 17px; height: 17px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--field-border); background: var(--field); }
.choice.on .radio { background: #fff; box-shadow: inset 0 0 0 5px var(--accent); }
.choice .s { grid-column: 2; font-size: 11px; color: var(--secondary); }
.bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }
.bullets li { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.bullets li svg { width: 22px; height: 22px; color: var(--accent); stroke-width: 1.5; }
.bullets b { display: block; }
.bullets span { color: var(--secondary); }

/* ===== HUD / Quit ===== */
.hud { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); z-index: 90; padding: 14px 22px; border-radius: 22px; font-size: 14px; display: flex; gap: 10px; align-items: center; animation: pop .18s ease-out; }
.hud kbd { font: 600 13px var(--font); background: var(--fill); border-radius: 7px; padding: 1px 7px; }
.quit-done { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; background: var(--content); }
.quit-done .card { border-radius: 22px; padding: 22px 26px; text-align: center; background: var(--group); }
.quit-done .card .app-ic { margin: 0 auto; }

.app-ic { border-radius: 24%; background: linear-gradient(180deg, #4aa3f0, #1d63c4); display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 2px 6px rgba(0,0,0,.2); }
.app-ic svg { width: 58%; height: 58%; stroke-width: 1.6; }
</style>

const net = () => NETWORKS[S.network];

function ipv4ToInt(ip) { const p = ip.split('.').map(Number); return ((p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]) >>> 0; }
const isIPv4 = s => /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(s);
const isIPv6 = s => /^[0-9a-f:]+$/i.test(s) && s.includes(':') && s.split('::').length <= 2 && s.length >= 2;
const isIP = s => isIPv4(s) || isIPv6(s);
const isDomain = s => /^(\*\.)?([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9-]{2,63}$/i.test(s);
function subnetContains(cidr, ip) {
  const [base, bits] = cidr.split('/');
  if (!isIPv4(base) || !isIPv4(ip)) return false;
  const mask = bits == 0 ? 0 : (~0 << (32 - Number(bits))) >>> 0;
  return (ipv4ToInt(base) & mask) === (ipv4ToInt(ip) & mask);
}
function ruleMatches(r, n) {
  if (!n.up) return false;
  const ssid = !r.ssids.length || (n.ssidState === 'available' && r.ssids.includes(n.ssid));
  const ifc = !r.ifaces.length || r.ifaces.some(i => n.ifaces.includes(i));
  const sub = !r.subnets.length || r.subnets.some(c => n.addrs.some(a => subnetContains(c, a)));
  return ssid && ifc && sub;
}
function evaluate() {
  if (S.mode === 'manual') return { profile: S.manualProfile, source: { kind: 'manual' } };
  const n = net();
  for (const r of S.rules) if (r.enabled && ruleMatches(r, n)) return { profile: r.profile, source: { kind: 'rule', id: r.id, name: r.name } };
  return { profile: S.defaultProfile, source: { kind: 'default' } };
}
const matchedRuleId = () => { const e = evaluate(); return e.source.kind === 'rule' ? e.source.id : null; };
function conditionSummary(r) {
  const parts = [];
  if (r.ssids.length) parts.push('Wi-Fi ' + r.ssids.join(', '));
  if (r.ifaces.length) parts.push(r.ifaces.map(i => ({ wifi: 'Wi-Fi', ethernet: 'Ethernet', other: 'Other' }[i])).join(' or ') + ' interface');
  if (r.subnets.length) parts.push('Subnet ' + r.subnets.join(', '));
  return parts.length ? parts.join(' · ') : 'Any network';
}
const busy = () => ['preparing', 'applying', 'restoring'].includes(S.proxy);
const proxyUsable = () => S.ext === 'active';

/* Runtime transitions (simulated) */
async function turnOn() {
  if (busy() || !proxyUsable()) return;
  S.proxy = 'preparing'; S.switchFailed = false; renderAll();
  await wait(1100);
  S.proxy = 'on'; S.activeId = evaluate().profile; renderAll();
}
async function restoreSystemDNS() {
  if (S.proxy === 'off') return;
  S.proxy = 'restoring'; renderAll();
  await wait(1000);
  S.proxy = 'off'; S.activeId = null; S.switchFailed = false; renderAll();
}
async function reapplyIfNeeded() {
  const target = evaluate().profile;
  if (S.proxy !== 'on' || target === S.activeId) { renderAll(); return; }
  S.proxy = 'applying'; renderAll();
  await wait(900);
  S.proxy = 'on'; S.activeId = evaluate().profile; S.switchFailed = false; renderAll();
}
function setMode(mode, profileId) {
  S.mode = mode;
  if (mode === 'manual') S.manualProfile = profileId ?? S.activeId ?? S.defaultProfile;
  reapplyIfNeeded();
}

/* ============================================================
   Generic UI pieces
   ============================================================ */
const sw = (on, action, opts = {}) => `<button class="switch ${on ? 'on' : ''} ${opts.large ? 'large' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(opts.label || '')}" data-action="${action}" ${opts.disabled ? 'disabled' : ''} ${opts.data || ''}></button>`;
const seg = (items, value, action, opts = {}) => `<div class="seg ${opts.full ? 'full' : ''}" role="radiogroup">${items.map(([v, l]) => `<button role="radio" aria-checked="${v === value}" class="${v === value ? 'on' : ''}" data-action="${action}" data-v="${v}" ${opts.disabled ? 'disabled' : ''}>${l}</button>`).join('')}</div>`;
const popup = (text, action, opts = {}) => `<button class="popup" data-action="${action}" ${opts.data || ''} ${opts.disabled ? 'disabled' : ''} aria-haspopup="menu"><span class="txt">${esc(text)}</span>${ic('chevUpDown')}</button>`;
const row = (label, value, opts = {}) => `<div class="row ${opts.cls || ''}" ${opts.attrs || ''}><span class="lbl">${label}</span><span class="val">${value}</span></div>`;
const section = (header, body, opts = {}) => `<div class="section">${header ? `<div class="section-header">${header}${opts.hint ? `<span class="hint">${opts.hint}</span>` : ''}</div>` : ''}<div class="group">${body}</div>${opts.footer ? `<div class="section-footer">${opts.footer}</div>` : ''}</div>`;
function testStatus(st) {
  if (!st) return '';
  if (st.state === 'testing') return `<span class="status-inline secondary"><span class="spinner"></span>Testing…</span>`;
  if (st.state === 'ok') return `<span class="status-inline green" role="status">${ic('checkCircle')}OK</span>`;
  return `<span class="status-inline red" role="status">${ic('xCircle')}${esc(st.reason)}</span>`;
}
async function runProfileTest(holder, key, profile) {
  holder[key] = { state: 'testing' }; renderAll();
  await wait(900 + Math.random() * 500);
  const fail = profile.transport === 'plain' && profile.server.startsWith('10.') || /fail/.test(profile.name.toLowerCase());
  holder[key] = fail ? { state: 'fail', reason: 'Upstream timed out' } : { state: 'ok' };
  renderAll();
}

/* ============================================================
   Main window
   ============================================================ */
function proxyPresentation() {
  const active = S.activeId ? prof(S.activeId) : null;
  const target = evaluate().profile;
  switch (S.proxy) {
    case 'on': return { badge: 'on', icon: 'shieldCheck', title: 'DNS Proxy On', sub: active ? `Using ${active.name} · ${transportName(active.transport)}` : '', menu: 'DNS Proxy On' };
    case 'off': return { badge: 'off', icon: 'shieldSlash', title: 'DNS Proxy Off', sub: 'System DNS is active', menu: 'DNS Proxy Off' };
    case 'preparing': return { badge: 'busy', spin: true, title: 'Preparing', sub: `Starting ${pname(target)}…`, menu: 'Preparing' };
    case 'applying': return { badge: 'busy', spin: true, title: 'Applying', sub: `Switching to ${pname(target)}…`, menu: 'Applying' };
    case 'restoring': return { badge: 'busy', spin: true, title: 'Restoring System DNS', sub: 'Turning off DNS Proxy…', menu: 'Restoring System DNS' };
    case 'recovery': return { badge: 'warn', icon: 'shieldWarn', title: 'Recovery Required', sub: 'DNS Proxy state cannot be confirmed', menu: 'Recovery Required' };
    case 'error': return { badge: 'err', icon: 'shieldWarn', title: 'Error', sub: 'DNS Proxy did not confirm an active Profile', menu: 'Error' };
  }
}

  const sbSub = S.proxy === 'on' ? `${pname(S.activeId)} · ${S.mode === 'auto' ? 'Automatic' : 'Manual'}` : S.proxy === 'off' ? 'System DNS' : pres.sub;
  el.innerHTML = `
    <aside class="sidebar glass" ${S.sidebarHidden ? 'hidden' : ''} data-drag="main">
      <div class="sb-top"><div class="traffic"><span class="close" data-action="closeMain" title="Close (app keeps running)"></span><span></span><span></span></div><span class="spacer"></span><button class="tb-btn" data-action="toggleSidebar" title="Hide Sidebar" aria-label="Hide Sidebar">${ic('sidebar')}</button></div>

        ${nav.map(([id, l, i, k]) => `<div class="sb-item ${S.page === id ? 'sel' : ''}" data-action="nav" data-v="${id}" role="link" aria-current="${S.page === id}">${ic(i)}<span>${l}</span><span class="key">${k}</span></div>`).join('')}

    </aside>
    <section class="detail">

    </section>
      ${S.sheet ? `<div class="scrim">${renderSheet()}</div>` : ''}

  `;
}

function toolbar(title, items = '', subtitle = '') {

    case 'rules': return renderRules();

/* ---------- Overview ---------- */
function renderOverview() {
  const pres = proxyPresentation();
  const ev = evaluate();
  const n = net();
  const on = ['on', 'preparing', 'applying'].includes(S.proxy);
  const toggleDisabled = busy() || !proxyUsable() || S.proxy === 'recovery';
  const badge = pres.spin ? `<div class="badge busy"><span class="spinner large"></span></div>` : `<div class="badge ${pres.badge}">${ic(pres.icon)}</div>`;

  const notices = [];
  if (S.ext === 'approval') notices.push(notice('puzzle', 'orange', 'System Extension Approval Required', 'Allow the DNSPilot extension in System Settings › General › Login Items & Extensions, then check again.', [['Open System Settings', 'noop', 'primary'], ['Check Again', 'extApprove']]));
  if (S.ext === 'notInstalled') notices.push(notice('puzzle', 'orange', 'System Extension Required', 'The DNS Proxy extension is not installed. Resume setup to install it.', [['Resume Setup', 'openOnboarding', 'primary']]));
  if (S.ext === 'updateRequired') notices.push(notice('puzzle', 'accent', 'System Extension Update Required', 'DNSPilot restores System DNS, updates the extension, then resumes the previous state.', [['Update Safely', 'extUpdate', 'primary']]));
  if (S.proxy === 'recovery') notices.push(notice('warn', 'orange', 'DNS Proxy State Cannot Be Confirmed', 'Ownership or manager state changed outside DNSPilot. Reconnect to verify, or restore System DNS.', [['Reconnect', 'reconnect', 'primary'], ['Restore System DNS', 'restore'], ['Open Diagnostics', 'openDiagnostics']]));
  if (S.proxy === 'error') notices.push(notice('xCircle', 'red', 'DNS Proxy Did Not Start', 'The extension did not confirm the Active Profile (runtime identity mismatch). System DNS remains active.', [['Retry', 'turnOn', 'primary'], ['Open Diagnostics', 'openDiagnostics']]));
  if (S.switchFailed && S.proxy === 'on') {
    const target = S.mode === 'manual' ? S.manualProfile : ev.profile;
    notices.push(notice('warn', 'orange', `Could Not Switch to ${pname(target)}`, `The upstream did not respond during reapply. ${pname(S.activeId)} is still active.`, [['Retry', 'retrySwitch', 'primary'], ...(S.mode === 'manual' ? [[`Use ${pname(S.activeId)} (Manual)`, 'useActiveManual']] : []), ['Restore System DNS', 'restore']]));

  const targetDiffers = (S.switchFailed || S.proxy === 'applying') && ev.profile !== S.activeId;
  const wifiText = n.ssidState === 'available' ? esc(n.ssid) : n.ssidState === 'denied' ? 'Permission Denied' : 'Not Connected to Wi-Fi';
  const ifText = n.ifaces.length ? n.ifaces.map(i => ({ wifi: 'Wi-Fi', ethernet: 'Ethernet' }[i])).join(', ') : 'None';

  return toolbar('Overview', `<button class="tb-circle glass" data-action="overviewMore" aria-label="More Actions" title="More Actions">${ic('ellipsis')}</button>`) + `
  <div class="page"><div class="page-inner">
    <div class="section"><div class="group">
      <div class="hero">${badge}
        <div class="grow"><h1>${esc(pres.title)}</h1><p class="trunc">${esc(pres.sub)}</p></div>
        ${sw(on, 'toggleProxy', { large: true, disabled: toggleDisabled, label: 'DNS Proxy' })}
      </div>
    </div></div>

    ${notices.map(x => `<div class="section"><div class="group">${x}</div></div>`).join('')}

    ${section('Mode', `
      <div class="row"><span class="lbl">Selection</span><span class="val">${seg([['auto', 'Automatic'], ['manual', 'Manual']], S.mode, 'setMode', { disabled: busy() })}</span></div>
      ${S.mode === 'manual' ? `<div class="row"><span class="lbl">Profile</span><span class="val">${popup(pname(S.manualProfile), 'pickManual', { disabled: busy() })}</span></div>` : ''}

    ${section('Current Selection', `

      ${row(`<span style="display:flex;gap:7px;align-items:center">${ic('ethernet')}Interfaces</span>`, ifText)}
      ${row(`<span style="display:flex;gap:7px;align-items:center">${ic('server')}Addresses</span>`, n.addrs.length ? `<span class="ip-list mono selectable">${n.addrs.map(esc).join('<br>')}</span>` : 'None')}

let testToken = 0;
async function runQuery() {
  const t = S.testUI;

  const host = up.hosts?.find(h => h.domain === domain || (h.domain.startsWith('*.') && (domain === h.domain.slice(2) || domain.endsWith(h.domain.slice(1)))));
  const sample = {
    A: [[domain, 300, 'A', host && isIPv4(host.address) ? host.address : '93.184.215.14']],
    AAAA: [[domain, 300, 'AAAA', '2606:2800:21f:cb07:6820:80da:af6b:8b2c']],
    CNAME: [], MX: [[domain, 3600, 'MX', '10 mail.' + domain]], TXT: [[domain, 3600, 'TXT', '"v=spf1 -all"']],
    NS: [[domain, 86400, 'NS', 'a.iana-servers.net'], [domain, 86400, 'NS', 'b.iana-servers.net']],
    SOA: [[domain, 3600, 'SOA', 'ns.icann.org. noc.dns.icann.org. 2026100301 7200 3600 1209600 3600']],
    SRV: [], CAA: [[domain, 3600, 'CAA', '0 issue "letsencrypt.org"']], PTR: [],

function draftFromProfile(p) {
  return { id: p.id, name: p.name, transport: p.transport, server: p.transport === 'plain' ? p.server : '', port: p.transport === 'plain' ? p.port : 53, dotServer: p.transport === 'tls' ? p.server : '', dotPort: p.transport === 'tls' ? p.port : 853, endpoint: p.endpoint, bootstrap: p.bootstrap.length ? [...p.bootstrap] : [''], hosts: p.hosts.map(h => ({ ...h, key: uid() })), errors: {} };
}
function normalizeDraft(d) {
  const base = { id: d.id, name: d.name.trim(), transport: d.transport, hosts: (d.hosts || []).map(h => ({ domain: h.domain.trim().toLowerCase(), address: h.address.trim() })).sort((a, b) => a.domain.localeCompare(b.domain)), bootstrap: [], endpoint: '', server: '', port: 53 };
  if (d.transport === 'plain') return { ...base, server: d.server.trim(), port: Number(d.port) || 53 };
  const bs = d.bootstrap.map(s => s.trim()).filter(Boolean);
  if (d.transport === 'tls') return { ...base, server: d.dotServer.trim(), port: Number(d.dotPort) || 853, bootstrap: bs };
  return { ...base, endpoint: d.endpoint.trim(), port: 443, bootstrap: bs };
}
function validateUpstream(d, withName) {
  const e = {};
  if (withName && !d.name.trim()) e.name = 'Enter a Profile name.';
  else if (withName && S.profiles.some(p => p.id !== d.id && p.name.toLowerCase() === d.name.trim().toLowerCase())) e.name = 'Another Profile already uses this name.';
  const port = (v, k) => { const n = Number(v); if (!/^\d+$/.test(String(v).trim()) || n < 1 || n > 65535) e[k] = 'Enter a port from 1 through 65535.'; };
  if (d.transport === 'plain') { if (!isIP(d.server.trim())) e.server = 'Enter an IPv4 or IPv6 address.'; port(d.port, 'port'); }
  if (d.transport === 'tls') { const s = d.dotServer.trim(); if (!(isIP(s) || isDomain(s))) e.dotServer = 'Enter a server name or IP address.'; port(d.dotPort, 'dotPort'); }
  if (d.transport === 'https') { const u = d.endpoint.trim(); if (!/^https:\/\/[^\s/]+\.[^\s/]+\/\S*$/.test(u)) e.endpoint = 'Enter an https:// URL with a path, such as /dns-query.'; }
  if (d.transport !== 'plain') d.bootstrap.forEach((b, i) => { if (b.trim() && !isIP(b.trim())) e['bootstrap' + i] = 'x'; });
  if (d.transport !== 'plain' && Object.keys(e).some(k => k.startsWith('bootstrap'))) e.bootstrap = 'Bootstrap servers must be IP addresses.';
  if (d.transport === 'tls' && isDomain(d.dotServer.trim()) && !d.bootstrap.some(b => b.trim())) e.bootstrap = 'Add at least one bootstrap server for a server name.';
  (d.hosts || []).forEach((h, i) => {
    const dom = h.domain.trim(); const wild = dom.startsWith('*.');
    if (!isDomain(dom) || dom.indexOf('*', 1) > 0) e['hd' + i] = 'Use example.com or *.example.com.';
    if (!isIP(h.address.trim())) e['ha' + i] = 'Enter an IPv4 or IPv6 address.';
    const fam = isIPv4(h.address.trim()) ? 4 : 6;
    (d.hosts || []).forEach((o, j) => {
      if (j >= i || e['hd' + i]) return;
      const od = o.domain.trim(); const ofam = isIPv4(o.address.trim()) ? 4 : 6;
      if (ofam !== fam) return;
      const covers = (w, x) => w.startsWith('*.') && (x === w.slice(2) || x.endsWith(w.slice(1)));
      if (od === dom || covers(od, dom.replace(/^\*\./, '')) || covers(dom, od.replace(/^\*\./, ''))) e['hd' + i] = `Overlaps with ${od} for the same address family.`;
    });
    void wild;
  });
  d.errors = e;
  return !Object.keys(e).length;
}

function openMenu(anchor, items, opts = {}) {
  const layer = $('#menuLayer');

  layer.innerHTML = `<div class="menu-layer" data-action="closeMenu"></div><div class="menu glass" role="menu">${items.map((it, i) => {
    if (it === '-') return '<div class="msep"></div>';

    if (it.info) return `<div class="mi info ${it.strong ? 'strong' : ''}"><span></span><span>${esc(it.info)}</span><span></span></div>`;
    return `<div class="mi ${it.disabled ? 'dis' : ''} ${it.danger ? 'danger' : ''}" role="menuitem" data-mi="${i}"><span class="ck">${it.checked ? ic('check') : ''}</span><span>${esc(it.label)}</span><span class="${it.sub ? 'sub-ar' : 'kb'}">${it.sub ? ic('chevRight') : esc(it.kb || '')}</span></div>`;
  }).join('')}</div>`;
  const menu = layer.querySelector('.menu');

  let x = opts.at ? opts.at[0] : r.left, y = opts.at ? opts.at[1] : r.bottom + 4;
  if (opts.alignSelected) { x = r.left - 6; y = r.top - 6; }

  menu.style.top = Math.min(y, innerHeight - menu.offsetHeight - 8) + 'px';
  menu.addEventListener('click', ev => {
    const el = ev.target.closest('[data-mi]'); if (!el) return;

    closeMenu(); it.action?.();
  });
  menu.addEventListener('mouseover', ev => {
    const el = ev.target.closest('[data-mi]'); if (!el) return;
    const it = items[+el.dataset.mi];
    if (it.sub && !opts.isSub) {
      const rr = el.getBoundingClientRect();
      const sub = document.createElement('div');
      layer.querySelectorAll('.menu.sub').forEach(m => m.remove());
      sub.className = 'menu glass sub'; sub.setAttribute('role', 'menu');
      sub.innerHTML = it.sub.map((s, j) => s === '-' ? '<div class="msep"></div>' : `<div class="mi ${s.disabled ? 'dis' : ''}" data-si="${j}"><span class="ck">${s.checked ? ic('check') : ''}</span><span>${esc(s.label)}</span><span class="kb"></span></div>`).join('');
      layer.appendChild(sub);
      sub.style.left = Math.min(rr.right + 2, innerWidth - sub.offsetWidth - 8) + 'px'; sub.style.top = (rr.top - 5) + 'px';

    } else if (!el.closest('.sub')) layer.querySelectorAll('.menu.sub').forEach(m => m.remove());
  });
}

/* Quit: two ⌘Q presses within 2 s; a menu click quits immediately */
let quitTimer = null;
function startQuit(immediate) {
  if (!immediate && !S.quitArmed) {
    S.quitArmed = true;
    $('#hudLayer').innerHTML = `<div class="hud glass" role="status" aria-live="polite">Press <kbd>⌘Q</kbd> again to quit DNSPilot</div>`;
    clearTimeout(quitTimer); quitTimer = setTimeout(() => { S.quitArmed = false; $('#hudLayer').innerHTML = ''; }, 2000);
    return;
  }
  clearTimeout(quitTimer); S.quitArmed = false; $('#hudLayer').innerHTML = '';
  if (S.sheet) { showAlert({ title: 'Discard Unsaved Changes?', message: 'You have an open editor. Quitting discards its changes.', buttons: [{ label: 'Discard and Quit', destructive: true, action: () => { S.sheet = null; doQuit(); } }, { label: 'Cancel', primary: true }] }); return; }

}
async function doQuit() {
  focusWin('main');

  if (wasOn) { S.alert = { title: 'Quitting DNSPilot', message: 'Restoring System DNS…', buttons: [] }; renderAll(); await wait(1200); }
  S.alert = null; S.proxy = 'off'; S.activeId = null; S.quitState = 'done'; renderAll();
}

  turnOn, restore: restoreSystemDNS,
  async reconnect() { S.proxy = 'applying'; renderAll(); await wait(1000); S.proxy = 'on'; S.activeId = evaluate().profile; renderAll(); },
  async retrySwitch() { S.switchFailed = false; S.proxy = 'applying'; renderAll(); await wait(900); S.proxy = 'on'; S.activeId = S.mode === 'manual' ? S.manualProfile : evaluate().profile; renderAll(); },
  useActiveManual() { S.switchFailed = false; S.mode = 'manual'; S.manualProfile = S.activeId; renderAll(); },
  extApprove() { S.ext = 'active'; renderAll(); },
  async extUpdate() { const was = S.proxy; S.proxy = 'restoring'; renderAll(); await wait(900); S.ext = 'active'; S.proxy = 'off'; renderAll(); if (was === 'on') turnOn(); },
  openDiagnostics() { openSettings('diagnostics'); },
  setMode(v) { if (v === S.mode) return; setMode(v); },
  pickManual(_, el) { openMenu(el, profileMenu('', S.manualProfile, id => setMode('manual', id)), { alignSelected: true, minWidth: el.offsetWidth + 12 }); },
  gotoProfile(v) { S.page = 'profiles'; S.selectedProfile = v; renderAll(); },
  gotoRule(v) { S.page = 'rules'; S.selectedRule = v; renderAll(); },
  testActive() { const p = prof(S.activeId); if (p) runProfileTest(S, 'overviewTest', p); },
  overviewMore(_, el) {
    openMenu(el, [{ label: 'Copy Diagnostic Summary' }, { label: 'Open Diagnostics Settings', action: () => openSettings('diagnostics') }, '-', { label: 'Restore System DNS', disabled: S.proxy === 'off' || busy(), action: restoreSystemDNS }]);
  },
  /* Profiles */
  selectProfile(v) { S.selectedProfile = v; renderAll(); },
  newProfile() { S.page = 'profiles'; S.sheet = { type: 'profile', mode: 'create', draft: { ...blankDraft(''), errors: {} } }; renderAll(); setTimeout(() => document.querySelector('[data-input="sheet:name"]')?.focus(), 0); },
  editProfile(v) { const p = prof(v); S.sheet = { type: 'profile', mode: 'edit', draft: draftFromProfile(p) }; renderAll(); },
  duplicateProfile(v) { const p = prof(v); const d = draftFromProfile(p); d.id = uid(); d.name = p.name + ' Copy'; S.sheet = { type: 'profile', mode: 'duplicate', draft: d }; renderAll(); },
  testProfile(v) { runProfileTest(S.profileTest, v, prof(v)); },
  makeDefault(v) { S.defaultProfile = v; reapplyIfNeeded(); },
  deleteProfile(v) { if (v) { S.sheet = { type: 'deleteProfile', id: v }; renderAll(); } },
  profileMore(v, el) { if (!v) return; openMenu(el, profileContext(v), { at: [el.getBoundingClientRect().left, el.getBoundingClientRect().top - 8 - 4 * 24 - 20] }); },
  pickReplacement(_, el) { openMenu(el, profileMenu('', S.sheet.replacement, id => { S.sheet.replacement = id; renderAll(); }).filter(i => i.label !== pname(S.sheet.id)), { alignSelected: true }); },
  confirmDeleteProfile() {
    const id = S.sheet.id, rep = S.sheet.replacement;
    S.rules.forEach(r => { if (r.profile === id) r.profile = rep; });
    if (S.defaultProfile === id) S.defaultProfile = rep;
    if (S.manualProfile === id) S.manualProfile = rep;
    if (S.activeId === id) S.activeId = rep;
    S.profiles = S.profiles.filter(p => p.id !== id);
    S.selectedProfile = S.profiles[0]?.id; S.sheet = null; renderAll();
  },
  sheetTransport(v) { S.sheet.draft.transport = v; S.sheet.draft.errors = {}; S.sheet.test = null; renderAll(); },
  sheetAddBootstrap() { S.sheet.draft.bootstrap.push(''); renderAll(); },
  sheetRemoveBootstrap(v) { S.sheet.draft.bootstrap.splice(+v, 1); if (!S.sheet.draft.bootstrap.length) S.sheet.draft.bootstrap.push(''); renderAll(); },
  sheetAddHost() { S.sheet.draft.hosts.push({ domain: '', address: '', key: uid() }); renderAll(); const ins = document.querySelectorAll('.hosts-table input'); ins[ins.length - 2]?.focus(); },
  sheetRemoveHost(v) { S.sheet.draft.hosts.splice(+v, 1); renderAll(); },
  async sheetTest() {
    const sh = S.sheet;
    if (!validateUpstream(sh.draft, false)) { renderAll(); focusFirstInvalid(); return; }
    sh.test = { state: 'testing' }; renderAll();
    await wait(1000);
    if (S.sheet !== sh) return;
    sh.test = normalizeDraft(sh.draft).server.startsWith('10.') ? { state: 'fail', reason: 'Upstream timed out' } : { state: 'ok' };
    renderAll();
  },
  async saveProfile() {
    const sh = S.sheet;
    if (!validateUpstream(sh.draft, true)) { renderAll(); focusFirstInvalid(); return; }
    const p = normalizeDraft(sh.draft);
    const editingActive = sh.mode === 'edit' && p.id === S.activeId && S.proxy === 'on';
    if (editingActive) { sh.saving = true; renderAll(); S.proxy = 'applying'; renderAll(); await wait(900); S.proxy = 'on'; }
    const i = S.profiles.findIndex(x => x.id === p.id);
    if (i >= 0) S.profiles[i] = p; else S.profiles.push(p);
    S.selectedProfile = p.id; S.sheet = null; renderAll();
  },
  closeSheet() { S.sheet = null; renderAll(); },
  /* Rules */
  selectRule(v, el, ev) { if (ev.target.closest('.switch')) return; S.selectedRule = v; renderAll(); },
  toggleRule(v) { const r = S.rules.find(x => x.id === v); r.enabled = !r.enabled; reapplyIfNeeded(); },
  newRule() { S.page = 'rules'; S.sheet = { type: 'rule', mode: 'create', draft: { id: uid(), name: '', enabled: true, ssids: [], ifaces: [], subnets: [], profile: S.defaultProfile, errors: {} } }; renderAll(); setTimeout(() => document.querySelector('[data-input="rule:name"]')?.focus(), 0); },
  editRule() { const r = S.rules.find(x => x.id === S.selectedRule); if (!r) return; S.sheet = { type: 'rule', mode: 'edit', draft: { ...r, ssids: [...r.ssids], ifaces: [...r.ifaces], subnets: [...r.subnets], errors: {} } }; renderAll(); },
  duplicateRule(v) { const r = S.rules.find(x => x.id === v); S.sheet = { type: 'rule', mode: 'create', draft: { ...r, id: uid(), name: r.name + ' Copy', ssids: [...r.ssids], ifaces: [...r.ifaces], subnets: [...r.subnets], errors: {} } }; renderAll(); },
  deleteRule() {
    const r = S.rules.find(x => x.id === S.selectedRule); if (!r) return;
    showAlert({ title: `Delete “${r.name}”?`, message: 'This permanently deletes the Rule. Automatic mode reevaluates immediately.', buttons: [{ label: 'Delete', destructive: true, action: () => { const i = S.rules.indexOf(r); S.rules.splice(i, 1); S.selectedRule = S.rules[Math.min(i, S.rules.length - 1)]?.id; reapplyIfNeeded(); } }, { label: 'Cancel', primary: true }] });
  },
  moveRule(v) { const i = S.rules.findIndex(r => r.id === S.selectedRule); const j = i + Number(v); if (i < 0 || j < 0 || j >= S.rules.length) return; const [r] = S.rules.splice(i, 1); S.rules.splice(j, 0, r); reapplyIfNeeded(); },
  pickDefault(_, el) { openMenu(el, profileMenu('', S.defaultProfile, id => { S.defaultProfile = id; reapplyIfNeeded(); }), { alignSelected: true, minWidth: el.offsetWidth + 12 }); },
  ruleEnabled() { S.sheet.draft.enabled = !S.sheet.draft.enabled; renderAll(); },
  rulePickProfile(_, el) { openMenu(el, profileMenu('', S.sheet.draft.profile, id => { S.sheet.draft.profile = id; renderAll(); }), { alignSelected: true }); },
  ruleAdd(_, el) { S.sheet.draft[el.dataset.k].push(''); renderAll(); const ins = document.querySelectorAll(`[data-input^="rule:${el.dataset.k}:"]`); ins[ins.length - 1]?.focus(); },
  ruleRemove(v, el) { S.sheet.draft[el.dataset.k].splice(+v, 1); renderAll(); },
  ruleAddCurrentSSID() { const d = S.sheet.draft; if (!d.ssids.includes(net().ssid)) d.ssids.push(net().ssid); renderAll(); },
  saveRule() {
    const d = S.sheet.draft; const e = {};
    if (!d.name.trim()) e.name = 'Enter a Rule name.';
    d.ssids = d.ssids.map(s => s.trim()).filter(Boolean);
    d.subnets = d.subnets.map(s => s.trim()).filter(Boolean);
    d.subnets.forEach((s, i) => { const [b, m] = s.split('/'); if (!(isIP(b) && /^\d+$/.test(m || '') && +m <= (isIPv4(b) ? 32 : 128))) e['subnets' + i] = 'x'; });
    if (Object.keys(e).some(k => k.startsWith('subnets'))) e.conditions = 'Subnets use CIDR notation, such as 192.168.1.0/24.';
    d.errors = e;
    if (Object.keys(e).length) { renderAll(); focusFirstInvalid(); return; }
    const { errors, ...rule } = d;
    const i = S.rules.findIndex(r => r.id === rule.id);
    if (i >= 0) S.rules[i] = rule; else S.rules.push(rule);
    S.selectedRule = rule.id; S.sheet = null; reapplyIfNeeded();
  },
  /* Test */
  testSource(v) { S.testUI.source = v; renderAll(); },
  testPickProfile(_, el) { openMenu(el, profileMenu('', S.testUI.profile, id => { S.testUI.profile = id; renderAll(); }), { alignSelected: true }); },
  testPickType(_, el) { openMenu(el, RECORD_TYPES.map(t => ({ label: t, checked: t === S.testUI.type, action: () => { S.testUI.type = t; renderAll(); } })), { alignSelected: true, minWidth: 90 }); },
  testTransport(v) { S.testUI.custom.transport = v; S.testUI.custom.errors = {}; renderAll(); },
  testAddBootstrap() { S.testUI.custom.bootstrap.push(''); renderAll(); },
  testRemoveBootstrap(v) { S.testUI.custom.bootstrap.splice(+v, 1); if (!S.testUI.custom.bootstrap.length) S.testUI.custom.bootstrap.push(''); renderAll(); },
  testQuery: runQuery,
  testCancel() { testToken++; S.testUI.state = 'empty'; renderAll(); },
  /* Alerts */
  alertBtn(v) { const b = S.alert.buttons[+v]; S.alert = null; renderAll(); b.action?.(); },
  settingsAlertBtn(v) { const b = S.settingsAlert.buttons[+v]; S.settingsAlert = null; renderAll(); b.action?.(); },
  /* Settings */
  openSettingsBtn() { openSettings(); },
  closeSettings() { S.settingsOpen = false; S.settingsAlert = null; focusWin('main'); },
  settingsTab(v) { S.settingsTab = v; renderAll(); },
  setLaunch() { S.settings.launchAtLogin = !S.settings.launchAtLogin; renderAll(); },
  cacheToggle() { const s = S.settings; s.cacheDraftOn = !s.cacheDraftOn; s.cacheStatus = null; if (!s.cacheDraftOn) s.cacheDraft = String(s.cacheCapacity); renderAll(); },
  cacheDefault() { const s = S.settings; s.cacheDraftOn = true; s.cacheDraft = '1000'; s.cacheStatus = null; renderAll(); },
  async cacheSave() {
    const s = S.settings;
    if (S.proxy !== 'on') { s.cacheOn = s.cacheDraftOn; s.cacheCapacity = Number(s.cacheDraft); s.cacheStatus = 'saved-off'; renderAll(); return; }
    s.cacheStatus = 'applying'; renderAll(); await wait(1000);
    s.cacheOn = s.cacheDraftOn; s.cacheCapacity = Number(s.cacheDraft); s.cacheStatus = 'saved'; renderAll();
  },
  deactivateExt() { S.settingsAlert = { title: 'Deactivate System Extension?', message: 'DNS Proxy will be restored to System DNS first. The extension must be installed again before DNSPilot can be turned on.', buttons: [{ label: 'Deactivate', destructive: true, action: async () => { await restoreSystemDNS(); S.ext = 'notInstalled'; renderAll(); } }, { label: 'Cancel', primary: true }] }; renderAll(); },
  requestLocation() { S.settings.location = 'allowed'; renderAll(); },
  toggleDebug() {
    const on = !S.settings.debug;
    S.settingsAlert = on ? { title: 'Enable Debug Logging?', message: 'Debug logs may contain full domain names, endpoint tokens, Wi-Fi names, IP addresses, and DNS answers.', buttons: [{ label: 'Enable', action: () => { S.settings.debug = true; renderAll(); } }, { label: 'Cancel', primary: true }] }
      : { title: 'Disable Debug Logging?', message: 'DNSPilot returns to standard, redacted logging.', buttons: [{ label: 'Disable', primary: true, action: () => { S.settings.debug = false; renderAll(); } }, { label: 'Cancel' }] };
    renderAll();
  },
  exportDiag() { S.settingsAlert = { title: 'Export Sensitive Diagnostics?', message: 'The exported file is not redacted and may contain DNS endpoints, Wi-Fi names, IP addresses, Profile details, and error messages.', buttons: [{ label: 'Export…', primary: true }, { label: 'Cancel' }] }; renderAll(); },
  /* Onboarding */
  openOnboarding() { S.onboarding = { open: true, step: 0, template: 'cf-doh', testState: null, location: null, ext: 'idle', proxy: 'idle' }; focusWin('onboarding'); },
  closeOnboarding() { S.onboarding.open = false; focusWin('main'); },
  obNext() { S.onboarding.step++; renderAll(); },
  obBack() { S.onboarding.step--; renderAll(); },
  obTemplate(v) { S.onboarding.template = v; S.onboarding.testState = null; renderAll(); },
  async obTest() { const o = S.onboarding; o.testState = { state: 'testing' }; renderAll(); await wait(1000); o.testState = { state: 'ok' }; renderAll(); await wait(500); o.step = 2; o.testState = null; renderAll(); },
  obAllowLocation() { S.onboarding.location = 'allowed'; renderAll(); },
  async obInstall() { const o = S.onboarding; o.ext = 'installing'; renderAll(); await wait(900); o.ext = 'approval'; renderAll(); },
  obApprove() { S.onboarding.ext = 'active'; renderAll(); },
  async obEnable() { const o = S.onboarding; o.proxy = 'enabling'; renderAll(); await wait(1200); o.proxy = 'on'; o.step = 5; renderAll(); },
  obFinish() { S.onboarding.open = false; S.ext = 'active'; if (S.proxy === 'off') turnOn(); focusWin('main'); },
  /* Menus & quit */
  menuExtra(_, el) { el.classList.add('open'); openMenu(el, menuExtraItems(), { minWidth: 250 }); },
  menuExtraBtn() { const el = $('#menuExtra'); el.classList.add('open'); openMenu(el, menuExtraItems(), { minWidth: 250 }); },
  closeMenu,
  quitKey() { startQuit(false); },
  relaunch() { S.quitState = null; S.proxy = 'off'; renderAll(); turnOn(); },
};
function profileContext(id) {
  return [
    { label: 'Edit…', action: () => A.editProfile(id) },
    { label: 'Duplicate', action: () => A.duplicateProfile(id) },
    { label: 'Test', disabled: busy(), action: () => A.testProfile(id) },
    { label: 'Make Default', disabled: id === S.defaultProfile, action: () => A.makeDefault(id) },
    '-',
    { label: 'Delete…', danger: true, action: () => A.deleteProfile(id) },
  ];
}
function ruleContext(id) {
  const i = S.rules.findIndex(r => r.id === id); const r = S.rules[i];
  return [
    { label: 'Edit…', action: () => { S.selectedRule = id; A.editRule(); } },
    { label: 'Duplicate', action: () => A.duplicateRule(id) },
    { label: r.enabled ? 'Disable' : 'Enable', action: () => A.toggleRule(id) },
    '-',
    { label: 'Move Up', disabled: i === 0, action: () => { S.selectedRule = id; A.moveRule(-1); } },
    { label: 'Move Down', disabled: i === S.rules.length - 1, action: () => { S.selectedRule = id; A.moveRule(1); } },
    '-',
    { label: 'Delete…', danger: true, action: () => { S.selectedRule = id; A.deleteRule(); } },
  ];
}

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  const win = ev.target.closest('.window');
  if (win && S.focused !== win.id && !el) focusWin(win.id);
  if (!el) return;
  if (win && S.focused !== win.id) { S.focused = win.id; Object.keys(Z).forEach(k => $('#' + k).style.zIndex = k === win.id ? 10 : 2); }
  if (el.disabled) return;
  const fn = A[el.dataset.action];
  if (fn) { ev.stopPropagation(); fn(el.dataset.v, el, ev); }
});
document.addEventListener('dblclick', ev => {
  const r = ev.target.closest('[data-rule]'); if (r && !ev.target.closest('.switch')) { S.selectedRule = r.dataset.rule; A.editRule(); }
  const p = ev.target.closest('[data-context="profile"]'); if (p) A.editProfile(p.dataset.v);
});
document.addEventListener('contextmenu', ev => {
  const el = ev.target.closest('[data-context]'); if (!el) return;
  ev.preventDefault();
  if (el.dataset.context === 'profile') { S.selectedProfile = el.dataset.v; renderAll(); openMenu(el, profileContext(el.dataset.v), { at: [ev.clientX, ev.clientY] }); }
  if (el.dataset.context === 'rule') { S.selectedRule = el.dataset.v; renderAll(); openMenu(el, ruleContext(el.dataset.v), { at: [ev.clientX, ev.clientY] }); }
});
document.addEventListener('input', ev => {
  const el = ev.target; const k = el.dataset.input; if (!k) return;
  const parts = k.split(':');
  if (k === 'profileFilter') { S.profileFilter = el.value; renderAll(); return; }
  if (k === 'testDomain') { S.testUI.domain = el.value; if (S.testUI.domainError) { S.testUI.domainError = null; renderAll(); } return; }
  if (k === 'cacheDraft') { S.settings.cacheDraft = el.value; S.settings.cacheStatus = null; renderAll(); return; }
  if (parts[0] === 'sheet' || parts[0] === 'test') {
    const d = parts[0] === 'sheet' ? S.sheet.draft : S.testUI.custom;
    if (parts[1] === 'bootstrap') d.bootstrap[+parts[2]] = el.value;
    else if (parts[1] === 'hosts') d.hosts[+parts[2]][parts[3]] = el.value;
    else d[parts[1]] = el.value;
    if (parts[0] === 'sheet' && S.sheet.test) { S.sheet.test = null; renderAll(); }
    return;
  }
  if (parts[0] === 'rule') {
    const d = S.sheet.draft;
    if (parts[1] === 'iface') { const i = parts[2]; d.ifaces = el.checked ? [...d.ifaces, i] : d.ifaces.filter(x => x !== i); return; }
    if (parts.length === 3) d[parts[1]][+parts[2]] = el.value; else d[parts[1]] = el.value;
  }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset.proto; if (!k) return;
  const v = ev.target.value;
  if (k === 'proxy') {
    S.switchFailed = v === 'switchFailed';
    S.proxy = v === 'switchFailed' ? 'on' : v;
    if (S.proxy === 'on' && !S.activeId) S.activeId = evaluate().profile;
    if (S.switchFailed) {
      if (S.mode === 'auto') { S.mode = 'manual'; }
      S.manualProfile = S.profiles.find(p => p.id !== S.activeId)?.id;
    }
    if (S.proxy === 'off' || S.proxy === 'error') S.activeId = null;
    if (S.proxy === 'recovery' && !S.activeId) S.activeId = evaluate().profile;
    renderAll(); return;
  }
  if (k === 'network') { S.network = v; reapplyIfNeeded(); return; }
  if (k === 'ext') { S.ext = v; if (v !== 'active' && S.proxy === 'on') { S.proxy = 'off'; S.activeId = null; } renderAll(); return; }
  S[k] = v; renderAll();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if ($('#menuLayer').innerHTML) { closeMenu(); return; }
    if (S.alert && S.alert.buttons.length) { S.alert = null; renderAll(); return; }
    if (S.settingsAlert) { S.settingsAlert = null; renderAll(); return; }
    if (S.sheet) { A.closeSheet(); return; }
    if (S.quitArmed) { clearTimeout(quitTimer); S.quitArmed = false; $('#hudLayer').innerHTML = ''; }
  }
  if (ev.key === 'Enter' && !ev.isComposing) {
    if (S.sheet?.type === 'profile' && ev.target.dataset?.input?.startsWith('sheet')) { ev.preventDefault(); A.saveProfile(); }
    else if (S.sheet?.type === 'rule' && ev.target.dataset?.input?.startsWith('rule')) { ev.preventDefault(); A.saveRule(); }
    else if (S.page === 'test' && ev.target.dataset?.input) { ev.preventDefault(); runQuery(); }
  }
  if (ev.ctrlKey && /^[1-4]$/.test(ev.key)) { S.page = ['overview', 'profiles', 'rules', 'test'][+ev.key - 1]; renderAll(); }
});

/* Rule drag-to-reorder */
let dragId = null;
document.addEventListener('dragstart', ev => { const r = ev.target.closest?.('[data-rule]'); if (!r) return; dragId = r.dataset.rule; r.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', ev => { const r = ev.target.closest?.('[data-rule]'); if (!r || !dragId) return; ev.preventDefault(); document.querySelectorAll('.drop-before').forEach(x => x.classList.remove('drop-before')); r.classList.add('drop-before'); });
document.addEventListener('drop', ev => {
  const r = ev.target.closest?.('[data-rule]'); if (!r || !dragId) return; ev.preventDefault();
  const from = S.rules.findIndex(x => x.id === dragId); const [item] = S.rules.splice(from, 1);
  const to = S.rules.findIndex(x => x.id === r.dataset.rule); S.rules.splice(to < 0 ? S.rules.length : to, 0, item);
  S.selectedRule = dragId; dragId = null; reapplyIfNeeded();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop-before').forEach(x => x.classList.remove('dragging', 'drop-before')); });

/* Window dragging + split dividers */
document.addEventListener('mousedown', ev => {
  const div = ev.target.closest('[data-divider]');
  if (div) {
    const pane = document.getElementById(div.dataset.divider); const start = ev.clientX; const w0 = pane.getBoundingClientRect().width;
    const move = e => { const w = Math.max(0, Math.min(460, w0 + e.clientX - start)); pane.style.flexBasis = w + 'px'; if (pane.id === 'testLeft') S.testUI.leftWidth = w; };
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move); addEventListener('mouseup', up); ev.preventDefault(); return;
  }
  const bar = ev.target.closest('[data-drag]');
  if (!bar || ev.target.closest('button, input, [data-action]')) return;
  const win = document.getElementById(bar.dataset.drag); const sx = ev.clientX, sy = ev.clientY; const x0 = win.offsetLeft, y0 = win.offsetTop;
  const move = e => { win.style.left = Math.max(120 - win.offsetWidth, x0 + e.clientX - sx) + 'px'; win.style.top = Math.max(0, y0 + e.clientY - sy) + 'px'; };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
// Clicking the menu bar extra re-shows the hidden main window via "Open DNSPilot"
const _focusWin = focusWin;
focusWin = function (name) { if (name === 'main') { $('#main').style.visibility = ''; } _focusWin(name); };

function tick() { const d = new Date(); $('#clock').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '  ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
tick(); setInterval(tick, 30000);
placeWindows();
focusWin('main');
</script>
